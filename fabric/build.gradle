plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-fabric"
}

// The actual code lives in ../src, shared with the Forge build - only the loader-specific
// bootstrap packages and manifest are excluded from each other's build.
sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java']
            exclude 'org/furranystudio/avalinexus/forge/**'
            exclude 'org/furranystudio/avalinexus/neoforge/**'
        }
        resources {
            srcDirs = ['../src/main/resources']
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/neoforge.mods.toml'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        name = 'Glitchfiend'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
}

dependencies {
    // MC 26.3 ships unobfuscated - no mappings dependency needed at all (official names ARE
    // the runtime names), unlike pre-26.1 Fabric mod setups.
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    implementation "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
    // Optional, only adds the config button to the mod list when installed
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, geckolib_version: geckolib_version, terrablender_version: terrablender_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
