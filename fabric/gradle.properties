org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
# IntelliJ isn't yet fully compatible with configuration cache (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# Must match the Forge build's Minecraft version. Values per https://fabricmc.net/develop/
minecraft_version=26.3
loom_version=1.18-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
# GeckoLib (models and animations) - https://github.com/bernie-g/geckolib
geckolib_version=5.5.7
# TerraBlender (biome regions) - https://github.com/Glitchfiend/TerraBlender
terrablender_version=26.3.0.0.7

# Shared metadata - keep in sync with the root gradle.properties (each loader is its own
# standalone Gradle project, so these can't be included from the root automatically).
mod_id=avalinexus
mod_name=Avali Nexus
mod_license=MIT
mod_version=1.0.0
mod_group_id=org.furranystudio
mod_authors=Maxime66410
mod_description=Avali Nexus introduces the nomadic Avali species to Minecraft. Explore their unique biome, discover high-tech villages, encounter new creatures, and unlock futuristic survival gear.
